[project]
name = "comfyui-magic-hour"
description = "Magic Hour AI image, video, and audio generation nodes for ComfyUI: image to video, face swap, talking photo, lip sync, upscaling, and more."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["magic-hour>=0.87.1"]

[project.urls]
Repository = "https://github.com/magichourhq/comfyui-magic-hour"
Documentation = "https://docs.magichour.ai"

[tool.comfy]
PublisherId = "magichour"
DisplayName = "Magic Hour"
Icon = "https://raw.githubusercontent.com/magichourhq/comfyui-magic-hour/main/assets/icon.png"
